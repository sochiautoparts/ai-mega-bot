name: Reaction Swarm 24/7 (10 bots)

# ════════════════════════════════════════════════════════════════════════════
# REACTION SWARM — 10 Telegram-ботов-админов ставят реакции и комментарии
# на новые посты в каналах (sochiautoparts, bmw_mpower_club, chasnastya,
# abakan_mebel). Работает 24/7 параллельно с AI Mega Bot ("Василий").
#
# АРХИТЕКТУРА (v2 — stable, no cancel loop, no PAT dependency):
#   - schedule "0,30 * * * *" (каждые 30 мин) — 48 запусков в сутки
#   - timeout-minutes: 25 (меньше 30, нет overlap)
#   - cancel-in-progress: true — новый run убивает старый (5-10 сек gap)
#   - NO re-dispatch — убран, т.к. GH_PAT_TOKEN был невалиден (401)
#     Schedule каждые 30 мин надёжнее и не требует secrets
#   - auto-restart loop внутри run step — переживает crash swarm.py
#   - swarm.py использует flock (.run.lock) — нет дублей инстансов
#   - swarm.py использует deleteWebhook при init — быстрее освобождает getUpdates
#
# ЗАДЕРЖКА ДО ПОСТА:
#   - Внутри 25-мин run: 1-2 сек (long-polling real-time)
#   - Между runs: 5-10 сек (cancel transition + checkout)
#   - Worst case: ~30 сек (если schedule задержан GitHub)
# ════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: reaction-swarm-single
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: reaction-swarm/requirements.txt

      - name: Install dependencies
        run: |
          cd reaction-swarm
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "=== Dependencies installed ==="

      - name: Clean Python cache
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true

      - name: Run Reaction Swarm with auto-restart
        env:
          BOT_TOKEN_ALLSTARSPAY: ${{ secrets.BOT_TOKEN_ALLSTARSPAY }}
          BOT_TOKEN_TIRES24:     ${{ secrets.BOT_TOKEN_TIRES24 }}
          BOT_TOKEN_ROSSKOZAP:   ${{ secrets.BOT_TOKEN_ROSSKOZAP }}
          BOT_TOKEN_ACTIVGLOBAL: ${{ secrets.BOT_TOKEN_ACTIVGLOBAL }}
          BOT_TOKEN_RECARS:      ${{ secrets.BOT_TOKEN_RECARS }}
          BOT_TOKEN_BILET_AVIA:  ${{ secrets.BOT_TOKEN_BILET_AVIA }}
          BOT_TOKEN_KOLESPRO:    ${{ secrets.BOT_TOKEN_KOLESPRO }}
          BOT_TOKEN_AUTOKOD:     ${{ secrets.BOT_TOKEN_AUTOKOD }}
          BOT_TOKEN_ZAPONLINE:   ${{ secrets.BOT_TOKEN_ZAPONLINE }}
          BOT_TOKEN_LUKOILOIL:   ${{ secrets.BOT_TOKEN_LUKOILOIL }}
          SWARM_CHANNELS:        "sochiautoparts,bmw_mpower_club,chasnastya,abakan_mebel"
          SWARM_LONG_POLL_TIMEOUT: "30"
          SWARM_STALE_WINDOW:     "86400"
          SWARM_COMMENT_PROB:     "0.75"
          SWARM_DISABLED_BOTS:    "allstarspay"
        run: |
          set +e
          cd reaction-swarm
          echo "=== Starting Reaction Swarm (daemon mode) ==="
          echo "Channels: $SWARM_CHANNELS"
          echo "Long-poll timeout: ${SWARM_LONG_POLL_TIMEOUT}s"
          echo "Stale window: ${SWARM_STALE_WINDOW}s (24h)"
          echo "Comment probability: ${SWARM_COMMENT_PROB}"
          echo "Disabled: $SWARM_DISABLED_BOTS"
          echo "=== Launching with auto-restart (max 25 min) ==="
          RETRY=0
          LAST_START=0
          while true; do
            RETRY=$((RETRY+1))
            echo "--- Attempt $RETRY (started $(date -u +%H:%M:%SZ)) ---"
            NOW=$(date +%s)
            if [ $((NOW - LAST_START)) -gt 300 ]; then
              RETRY=1
            fi
            LAST_START=$NOW
            python3 -u swarm.py --daemon
            EXIT_CODE=$?
            echo "Swarm exited with code $EXIT_CODE (attempt $RETRY) at $(date -u +%H:%M:%SZ)"
            # Exponential backoff: 5s, 10s, 15s, 30s
            if [ $EXIT_CODE -eq 0 ]; then
              sleep 5
            elif [ $RETRY -le 2 ]; then
              sleep 10
            elif [ $RETRY -le 4 ]; then
              sleep 15
            else
              sleep 30
            fi
          done

      - name: Cleanup
        if: always()
        run: echo "=== Swarm session ended at $(date -u +%H:%M:%SZ) ==="
